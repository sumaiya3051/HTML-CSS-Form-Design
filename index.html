
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Ocean Breeze</title>

    <meta name="description" content="Welcome to Ocean Breeze - a simple and elegant login and registration website.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website Header -->
    <header class="site-header">
        <a href="index.html" class="logo">
            <span class="logo-icon">🌊</span>
            Ocean Breeze
        </a>

        <nav>
            <a href="index.html" class="active">Login</a>
            <a href="registration.html">Register</a>
        </nav>
    </header>

    <!-- Main Login Section -->
    <main class="login-container">

        <section class="login-card">

            <div class="welcome-icon">☁</div>

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                We're happy to see you again.
                Please login to your account.
            </p>

            <form action="#" method="POST">

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Login Button -->
                <button type="submit" class="primary-btn">
                    Login
                    <span>→</span>
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Registration Link -->
            <p class="register-link">
                Don't have an account?
                <a href="registration.html">Create Account</a>
            </p>

        </section>

        <p class="bottom-message">
            A little breeze of simplicity in your digital world.
        </p>

    </main>

    <!-- Website Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 Ocean Breeze. All Rights Reserved.</p>
    </footer>

</body>

</html>
